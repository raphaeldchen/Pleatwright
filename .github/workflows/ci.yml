name: CI

# The public repo's CI: the web app's tests and build, and the static site end to end in a
# real Chromium (a dog_0 gallery folded natively, then a real fold in Pyodide). The jobs are
# the private repo's web and site-e2e jobs, unchanged. The pipeline's Python tests are not
# exported, so none run here. Exported from the private repo by scripts/export_public.py;
# do not edit here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  site-e2e:
    # The static site (npm run build:site) in a real Chromium: the gallery, a real fold in
    # Pyodide, cancel/retry, a reload mid-fold and the CSP (app/web/e2e/). Firefox and
    # WebKit are run by hand (npm run e2e -- --project=firefox --project=webkit).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', '.github/workflows/ci.yml') }}
      - name: Install Python dependencies
        # build_gallery.py folds the dog_0 example natively; the same pins as the test job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "numpy==2.4.3" "matplotlib==3.11.2" \
            "python-sat==1.9.dev15" "trimesh==4.12.2" "pillow==12.2.0" \
            "openai==2.43.0" "gradio_client==2.5.0" "httpx==0.28.1" "python-dotenv" \
            "fastapi==0.138.1" "uvicorn==0.49.0" "websockets==16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/web/package-lock.json') }}
      - name: Cache Pyodide wheels
        # fetch-pyodide checks every file against pyodide-lock.json's sha256.
        uses: actions/cache@v4
        with:
          path: app/web/public-site/pyodide
          key: pyodide-${{ hashFiles('app/web/scripts/fetch-pyodide.mjs', 'app/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Build the site with a dog_0 gallery
        run: npm run e2e:prepare
        env:
          PYTHON: python
      - name: A job's files reach JS intact above 2 GiB of wasm heap
        run: node scripts/pyodide-high-heap.mjs
      - run: npm run e2e -- --project=chromium
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/web/playwright-report/
            app/web/test-results/
          retention-days: 7
