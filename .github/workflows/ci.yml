name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', '.github/workflows/ci.yml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "numpy==2.4.3" "matplotlib==3.11.2" \
            "python-sat==1.9.dev15" "trimesh==4.12.2" "pillow==12.2.0" \
            "openai==2.43.0" "gradio_client==2.5.0" "httpx==0.28.1" "python-dotenv" \
            "fastapi==0.138.1" "uvicorn==0.49.0" "websockets==16.0"
      - name: Test
        run: make PYTHON=python test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
