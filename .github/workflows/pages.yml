name: Pages

# Builds the static site (native gallery, self-hosted Pyodide, site build) and deploys it to
# GitHub Pages. Exported from the private repo by scripts/export_public.py; do not edit here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 49 native folds (the demo scorpion, and the 51 rolls but the 3 starfish), 3 at a
    # time, on a 4-core runner: about 20-25 minutes of folding, allowing for dog_1's large
    # certification and for the runner being slower than the evidence's Mac. A gallery
    # cache hit skips all of it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', '.github/workflows/pages.yml') }}
      - name: Install Python dependencies
        # the same pins as the private repo's CI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "numpy==2.4.3" "matplotlib==3.11.2" \
            "python-sat==1.9.dev15" "trimesh==4.12.2" "pillow==12.2.0" \
            "openai==2.43.0" "gradio_client==2.5.0" "httpx==0.28.1" "python-dotenv" \
            "fastapi==0.138.1" "uvicorn==0.49.0" "websockets==16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Restore the native gallery
        id: gallery
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gallery
          key: gallery-${{ runner.os }}-${{ hashFiles('mcp_harness/pleatwright/**', 'mcp_harness/*.py', 'mcp_harness/fixtures/full17_v3_sticks/**', 'app/browser/gallery_trees/**', 'app/browser/gallery_meshes/**', 'app/browser/build_gallery.py', 'app/browser/browser_heap.json', 'app/server/pleatwright_app/**', '.github/workflows/pages.yml') }}
      - name: Fold the example trees natively
        # --jobs 3, not 4: dog_1 alone peaks near 4.6 GB and the runner has 16 GB.
        # build_gallery.py exits 1 if any roll fails to fold, which fails the workflow.
        if: steps.gallery.outputs.cache-hit != 'true'
        run: python app/browser/build_gallery.py "$RUNNER_TEMP/gallery" --rolls all --jobs 3 --heap app/browser/browser_heap.json
      - name: Cache Pyodide wheels
        # fetch-pyodide checks every file against pyodide-lock.json's sha256.
        uses: actions/cache@v4
        with:
          path: app/web/public-site/pyodide
          key: pyodide-${{ hashFiles('app/web/scripts/fetch-pyodide.mjs', 'app/web/package-lock.json') }}
      - name: Build the site
        working-directory: app/web
        env:
          PYTHON: python
        run: |
          npm ci
          npm run fetch-pyodide
          npm run bundle-py
          npm run build:site
      - name: Add the gallery to the site
        run: |
          mkdir -p app/web/dist-site/gallery
          cp -R "$RUNNER_TEMP/gallery/." app/web/dist-site/gallery/
      - name: Check the site build, gallery included
        working-directory: app/web
        run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
